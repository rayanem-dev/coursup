  nav button.on{color:var(--pri);border-color:var(--pri);font-weight:600}
  main{max-width:760px;margin:0 auto;padding:14px;padding-bottom:calc(14px + env(safe-area-inset-bottom,0px))}
  .card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px;margin-bottom:14px}
  .card h2{margin:0;font-size:19px}
  .sub{color:var(--mut);font-size:13px}
  .head{display:flex;justify-content:space-between;align-items:center;gap:8px}
  .course{border-top:1px solid var(--bd);margin-top:12px;padding-top:12px}
  .course h3{margin:0;font-size:16px}
  .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:10px 0}
  .stat{background:var(--bg);border-radius:8px;padding:8px;text-align:center}
  .stat b{display:block;font-size:14px}
  .stat span{font-size:11px;color:var(--mut)}
  .due{color:var(--warn)} .ok{color:var(--ok)}
  .row{display:flex;align-items:center;gap:8px;padding:10px 0;border-top:1px solid var(--bd)}
  .row:first-child{border-top:0}
  .grow{flex:1;min-width:0}
  .badge{font-size:11px;padding:2px 8px;border-radius:99px;background:var(--bg);color:var(--mut);white-space:nowrap}
  .badge.Faite,.badge.Payé{background:#d3f9d8;color:#2b8a3e}
  .badge.Annulée,.badge.Impayé{background:#ffe3e3;color:var(--ko)}
  .badge.Reportée,.badge.Partiel{background:#fff3bf;color:#e67700}
  .badge.Prévue{background:#dbe4ff;color:var(--pri)}
  button.b{border:1px solid var(--bd);background:#fff;border-radius:8px;padding:7px 10px;font-size:13px;cursor:pointer}
  button.p{background:var(--pri);color:#fff;border-color:var(--pri)}
  button.d{color:var(--ko);border-color:#f3c4c4}
  button.i{padding:4px 8px}
  .actions{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
  .filters{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap}
  input,select{width:100%;padding:9px;border:1px solid var(--bd);border-radius:8px;font-size:15px;font-family:inherit;background:#fff}
  input[type=checkbox],input[type=radio]{width:auto}
  .filters input,.filters select{width:auto;flex:1;min-width:130px}
  label{display:block;font-size:12px;color:var(--mut);margin:10px 0 4px}
  label.chk{display:flex;align-items:center;gap:10px;font-size:15px;color:var(--txt);margin:8px 0;cursor:pointer}
  label.chk input{width:22px;height:22px;flex:none}
  .modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:flex-end;justify-content:center;z-index:20}
  .modal.hidden{display:none}
  .box{background:#fff;width:100%;max-width:520px;border-radius:16px 16px 0 0;padding:16px;max-height:90vh;overflow:auto}
  @media(min-width:600px){.modal{align-items:center}.box{border-radius:16px}}
  .days{display:flex;gap:6px;flex-wrap:wrap}
  .days label{display:flex;align-items:center;gap:4px;margin:0;font-size:14px;color:var(--txt);border:1px solid var(--bd);border-radius:8px;padding:6px 10px}
  .empty{color:var(--mut);text-align:center;padding:18px 0;font-size:14px}
  .g2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .g2b{display:grid;grid-template-columns:1fr auto auto;gap:8px;align-items:center}
  table{width:100%;border-collapse:collapse;font-size:13px;margin-top:8px}
  th,td{padding:7px 4px;text-align:right;border-bottom:1px solid var(--bd)}
  th:first-child,td:first-child{text-align:left}
  .kpis{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
  .kpi{border-radius:12px;padding:14px;color:#fff}
  .kpi.a{background:linear-gradient(135deg,#3b5bdb,#5c7cfa)}
  .kpi.b{background:linear-gradient(135deg,#e8590c,#f76707)}
  .kpi.c{background:linear-gradient(135deg,#2f9e44,#40c057)}
  .kpi.d{background:linear-gradient(135deg,#ae3ec9,#be4bdb)}
  .kpi b{display:block;font-size:22px}
  .kpi span{font-size:12px;opacity:.9}
  .cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:3px;margin-top:10px}
  .cal .dow{font-size:11px;color:var(--mut);text-align:center;padding:2px 0}
  .cal .day{min-height:66px;background:var(--bg);border-radius:6px;padding:2px;cursor:pointer;overflow:hidden}
  .cal .day.out{background:transparent;cursor:default}
  .cal .day.today{outline:2px solid var(--pri);background:#edf2ff}
  .cal .num{font-size:11px;color:var(--mut);text-align:right;padding:0 2px}
  .chip{font-size:10px;line-height:1.25;padding:2px 3px;border-radius:4px;margin-top:2px;border-left:3px solid;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer}
  .chip.Annulée,.chip.Reportée{opacity:.5;text-decoration:line-through}
  .chip.late{box-shadow:0 0 0 1.5px var(--warn)}
  .legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--mut);margin-top:10px;align-items:center}
  .dot{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px;vertical-align:-1px}
  .install{display:none;align-items:center;gap:10px;background:linear-gradient(135deg,#1A1A2E,#3b5bdb);color:#fff;border-radius:12px;padding:12px 14px;margin-bottom:14px}
  .install .em{font-size:22px}
  .install .txt{flex:1;font-size:12.5px;line-height:1.4}
  .install .txt b{display:block;font-size:13.5px}
  .install button{border:0;border-radius:8px;padding:8px 12px;font-size:12.5px;font-weight:700;cursor:pointer}
  .install .go{background:#fff;color:var(--pri)}
  .install .close{background:transparent;color:rgba(255,255,255,.8);padding:8px}
  .avatar{width:40px;height:40px;border-radius:50%;overflow:hidden;flex:none;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:16px}
  .avatar img{width:100%;height:100%;object-fit:cover;display:block}
  .crumbs{padding:2px 2px 10px;font-size:13px;color:var(--mut);word-break:break-word}
  .crumbs a{color:var(--pri);cursor:pointer;text-decoration:none}
  .crumbs a:hover{text-decoration:underline}
</style>
</head>

function p2(n){return String(n).padStart(2,'0');}
function iso(d){return d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate());}
function today(){return iso(new Date());}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function fmt(n){return (Number(n)||0).toLocaleString('fr-FR')+' DA';}
function fd(s){var d=new Date(String(s).slice(0,10)+'T00:00');return isNaN(d)?s:d.toLocaleDateString('fr-FR',{weekday:'short',day:'numeric',month:'short'});}
function fs(s){var d=new Date(String(s).slice(0,10)+'T00:00');return isNaN(d)?s:d.toLocaleDateString('fr-FR',{day:'numeric',month:'short'});}
function v(id){return document.getElementById(id).value;}
function same(a,b){return String(a)===String(b);}
function enf(id){return D.enfants.find(function(e){return same(e.ID,id);})||{Nom:'?'};}
function crs(id){return D.cours.find(function(c){return same(c.ID,id);})||{Matiere:'?',PrixMois:0,SeancesMois:8};}
function seance(id){return D.seances.find(function(s){return same(s.ID,id);});}
function cname(c){return enf(c.EnfantID).Nom+' — '+c.Matiere+(c.Prof?' ('+c.Prof+')':'');}
function choraire(c){return c&&c.Heure?' · '+esc(c.Heure):'';}
function ccol(eid){var i=D.enfants.findIndex(function(e){return same(e.ID,eid);});return PAL[(i<0?0:i)%PAL.length];}
function dowName(s){return DOW[new Date(s+'T00:00').getDay()];}
function avatarImg(e){
  var photo=e.Photo||PHOTOS[subjNorm(e.Nom)];
  if(photo)return '<img src="'+photo+'" alt="">';
  return esc((e.Nom||'?').charAt(0).toUpperCase());
}

function subjNorm(s){return String(s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');}
function subjIcon(mat){
  var n=subjNorm(mat);
  for(var i=0;i<SUBJ_ICONS.length;i++){
    var kws=SUBJ_ICONS[i][0];
    for(var j=0;j<kws.length;j++){if(n.indexOf(subjNorm(kws[j]))>=0)return SUBJ_ICONS[i][1];}
  }
  return '📖';
}
function subjIconBig(mat){return '<span style="font-size:19px;vertical-align:-3px;display:inline-block">'+subjIcon(mat)+'</span>';}

function call(fn){
  var args=[].slice.call(arguments,1);
  document.getElementById('app').style.opacity=.5;
  var r=google.script.run.withSuccessHandler(function(d){D=d;document.getElementById('app').style.opacity=1;render();})
    .withFailureHandler(function(e){document.getElementById('app').style.opacity=1;alert(e.message||e);});
  r[fn].apply(r,args);
}

function addDays(s,n){var p=s.split('-').map(Number);return iso(new Date(p[0],p[1]-1,p[2]+n));}
function addMonth(s,n){
  var p=s.split('-').map(Number), last=new Date(p[0],p[1]-1+n+1,0).getDate();
  return iso(new Date(p[0],p[1]-1+n,Math.min(p[2],last)));
}
function pstart(x){var m=String(x.Mois||x.Date).slice(0,10);return m.length===7?m+'-01':m;}

function cycles(c){
  var set={};
  D.paiements.forEach(function(x){if(same(x.CoursID,c.ID))set[pstart(x)]=1;});
  var ss=Object.keys(set).sort();
  if(!ss.length){
    var first=null;
    D.seances.forEach(function(x){
      if(same(x.CoursID,c.ID)&&(x.Statut==='Faite'||x.Statut==='Prévue')){var d=String(x.Date).slice(0,10);if(!first||d<first)first=d;}
    });
    if(!first)return [];
    ss=[first];
  }
  var t=today(), starts=[];
  ss.forEach(function(s,i){
    starts.push(s);
    var next=ss[i+1], cur=addMonth(s,1);
    while(next?cur<=addDays(next,-15):cur<=t){starts.push(cur);cur=addMonth(cur,1);}
  });
  starts.sort();
  return starts.map(function(s,i){return {start:s,end:i<starts.length-1?starts[i+1]:addMonth(s,1)};});
}
function curCycle(cys){
  var t=today();
  for(var i=0;i<cys.length;i++){if(cys[i].start<=t&&t<cys[i].end)return cys[i];}
  return cys.length?cys[cys.length-1]:null;
}
function cyStat(c,cy){
  var f=0,pr=0,paye=0;
  D.seances.forEach(function(x){
    if(!same(x.CoursID,c.ID))return;
    var d=String(x.Date).slice(0,10);
    if(d<cy.start||d>=cy.end)return;
    if(x.Statut==='Faite')f++;else if(x.Statut==='Prévue')pr++;
  });
  D.paiements.forEach(function(x){if(same(x.CoursID,c.ID)&&pstart(x)===cy.start)paye+=Number(x.Montant)||0;});
  var prix=Number(c.PrixMois)||0;
  return {faites:f,prevues:pr,paye:paye,prix:prix,reste:prix-paye};
}
function cStat(c){
  var due=0,paid=0;
  cycles(c).forEach(function(cy){var s=cyStat(c,cy);due+=s.prix;paid+=s.paye;});
  return {due:due,paid:paid,reste:due-paid};
}
function payBadge(s){
  if(s.prix>0&&s.paye>=s.prix)return 'Payé';
  return s.paye>0?'Partiel':'Impayé';
}
function plabel(cy){return fs(cy.start)+' → '+fs(addDays(cy.end,-1));}
function weekBounds(t){
  var d=new Date(t+'T00:00'), dow=(d.getDay()+6)%7; // 0 = lundi
  var start=addDays(t,-dow);
  return {start:start, end:addDays(start,7)};
}
function nextDue(c,cy){
  if(!cy)return null;
  var s=cyStat(c,cy);
  return s.reste<=0 ? cy.end : cy.start;
}

function nextDate(c,after){
  var days=String(c.Jours||'').split(',').map(function(x){return x.trim();});
  var taken={};
  D.seances.forEach(function(x){if(same(x.CoursID,c.ID)&&x.Statut!=='Annulée'&&x.Statut!=='Reportée')taken[String(x.Date).slice(0,10)]=1;});
  var t=today(), from=String(after).slice(0,10)>t?String(after).slice(0,10):t;
  for(var i=1;i<=30;i++){var d=addDays(from,i);if(days.indexOf(dowName(d))>=0&&!taken[d])return d;}
  return addDays(from,1);
}

function render(){

  var h='';
  if(tab==='home')h=vHome();
  if(tab==='cal')h=vCalTab();
  if(tab==='seances')h=vSeances();
  if(tab==='paie')h=vPaie();
  if(tab==='sujet')h=vSujet();
  if(tab==='set')h=vSet();
  document.getElementById('app').innerHTML=h;
}

function matchHoraire(mat){
  var n=subjNorm(mat);
  for(var i=0;i<SUBJ_HORAIRE.length;i++){
    var kws=SUBJ_HORAIRE[i][0];
    for(var j=0;j<kws.length;j++){if(n.indexOf(subjNorm(kws[j]))>=0)return {jours:SUBJ_HORAIRE[i][1],heure:SUBJ_HORAIRE[i][2]};}
  }
  return null;
}
function applyRentree(){
  var matches=D.cours.map(function(c){return {c:c,h:matchHoraire(c.Matiere)};}).filter(function(x){return x.h;});
  if(!matches.length){alert('Aucun cours ne correspond à Science, Physique ou Musique.');return;}
  var msg='Appliquer ces horaires de rentrée ?\n\n'+matches.map(function(x){
    return '• '+cname(x.c)+' → '+x.h.jours.replace(/,/g,', ')+' · '+x.h.heure;
  }).join('\n');
  if(!confirm(msg))return;
  matches.forEach(function(x){call('saveCours',{ID:x.c.ID,Jours:x.h.jours,Heure:x.h.heure});});
}

function loadSuj(id){

    .withFailureHandler(function(e){sujLoading=false;sujErr=(e&&e.message)||String(e);render();})

function openSujFolder(i){
  var f=sujCur.folders[i];

}
function sujGoto(i){
  sujPath=sujPath.slice(0,i);
  loadSuj(i===0?SUJET_ROOT:sujPath[sujPath.length-1].id);
}
function fileEmoji(m){
  m=m||'';
  if(m.indexOf('folder')>=0)return '📁';
  if(m.indexOf('pdf')>=0)return '📕';
  if(m.indexOf('image')>=0)return '🖼️';
  if(m.indexOf('video')>=0)return '🎬';
  if(m.indexOf('audio')>=0)return '🎧';
  if(m.indexOf('spreadsheet')>=0)return '📊';
  if(m.indexOf('presentation')>=0)return '📽️';
  if(m.indexOf('document')>=0)return '📝';
  if(m.indexOf('zip')>=0||m.indexOf('compressed')>=0)return '🗜️';
  return '📄';
}
function fmtSize(n){
  if(!n)return '';
  if(n<1024)return n+' o';
  if(n<1024*1024)return Math.round(n/1024)+' Ko';
  return (n/1024/1024).toFixed(1)+' Mo';
}

      +'<div class="actions"><a class="b p" href="https://drive.google.com/drive/folders/'+curId+'" target="_blank">Ouvrir dans Google Drive ↗</a></div></div>';
  }
  if(sujLoading||sujCur===null)return crumbs+'<div class="card"><div class="empty">Chargement…</div></div>';
  var folders=sujCur.folders||[], files=sujCur.files||[];
  var body=!folders.length&&!files.length?'<div class="empty">Ce dossier est vide.</div>'
    :folders.map(function(f,i){
      return '<div class="row" style="cursor:pointer" onclick="openSujFolder('+i+')"><span style="font-size:20px">📁</span>'

        +'<div class="grow"><b>'+esc(f.name)+'</b><div class="sub">'+fmtSize(f.size)+(f.updated?' · '+f.updated:'')+'</div></div><span class="sub">↗</span></a>';
    }).join('');
  return crumbs+'<div class="card">'+body+'</div>'
    +'<div class="actions"><a class="b" href="https://drive.google.com/drive/folders/'+curId+'" target="_blank">Ouvrir ce dossier dans Drive ↗</a></div>';

function vAvatars(){

function vDash(){
  var reste=0, next=null, t=today(), m=t.slice(0,7);
  D.cours.forEach(function(c){
    reste+=cStat(c).reste;
    var cy=curCycle(cycles(c)), d=nextDue(c,cy);
    if(d&&(!next||d<next.date))next={date:d,c:c};
  });
  var nextTxt=next?(next.date<=t?'Maintenant':fs(next.date))+' · '+esc(cname(next.c)):'—';

  var encaisse=0;
  D.paiements.forEach(function(x){if(String(x.Date).slice(0,7)===m)encaisse+=Number(x.Montant)||0;});

  var wk=weekBounds(t), wFaites=0, wTot=0;
  D.seances.forEach(function(s){
    var d=String(s.Date).slice(0,10);
    if(d<wk.start||d>=wk.end)return;
    if(s.Statut==='Annulée')return;
    wTot++;
    if(s.Statut==='Faite')wFaites++;
  });

  return '<div class="kpis">'
    +'<div class="kpi a"><span>Reste à payer (total)</span><b>'+fmt(Math.max(reste,0))+'</b></div>'
    +'<div class="kpi b"><span>Prochain paiement</span><b style="font-size:16px">'+nextTxt+'</b></div>'
    +'<div class="kpi c"><span>Encaissé ce mois</span><b>'+fmt(encaisse)+'</b></div>'
    +'<div class="kpi d"><span>Séances cette semaine</span><b>'+wFaites+' / '+wTot+'</b></div>'
    +'</div>';
}

function vCal(){
  var p=calMonth.split('-').map(Number), t=today();
  var lead=(new Date(p[0],p[1]-1,1).getDay()+6)%7, dim=new Date(p[0],p[1],0).getDate();
  var title=new Date(p[0],p[1]-1,1).toLocaleDateString('fr-FR',{month:'long',year:'numeric'});
  var by={};
  D.seances.forEach(function(s){var d=String(s.Date).slice(0,10);(by[d]=by[d]||[]).push(s);});
  var h='<div class="card"><div class="head"><button class="b i" onclick="calMove(-1)">‹</button>'

    +'<div class="actions" style="justify-content:center"><button class="b i" onclick="calMonth=today().slice(0,7);render()">Aujourd\'hui</button></div>'
    +'<div class="cal">'+DAYS.map(function(d){return '<div class="dow">'+d+'</div>';}).join('');
  for(var i=0;i<lead;i++)h+='<div class="day out"></div>';
  for(var d=1;d<=dim;d++){
    var ds=p[0]+'-'+p2(p[1])+'-'+p2(d);

      return D.enfants.findIndex(function(e){return same(e.ID,crs(a.CoursID).EnfantID);})-D.enfants.findIndex(function(e){return same(e.ID,crs(b.CoursID).EnfantID);});});
    h+='<div class="day'+(ds===t?' today':'')+'" onclick="openSeance(null,\'\',\''+ds+'\')"><div class="num">'+d+'</div>'
      +list.map(function(s){
        var c=crs(s.CoursID), col=ccol(c.EnfantID), late=s.Statut==='Prévue'&&ds<=t;
        return '<div class="chip '+s.Statut+(late?' late':'')+'" style="background:'+col+'22;border-left-color:'+col+'" title="'+esc(cname(c)+(c.Heure?' · '+c.Heure:'')+' — '+s.Statut)+'" '
          +'onclick="event.stopPropagation();openAct(\''+s.ID+'\')">'+(s.Statut==='Faite'?'✓':subjIcon(c.Matiere))+' '+esc(enf(c.EnfantID).Nom.charAt(0)+' · '+c.Matiere)+'</div>';
      }).join('')+'</div>';
  }

   +'<div><label>Prix du mois (DA)</label><input id="n-prix" type="number" value="0"></div>'
   +'<div><label>Séances par mois</label><input id="n-nb" type="number" value="8"></div></div>'
   +'<label>Jours habituels</label><div class="days">'+DAYS.map(function(d){
      return '<label><input type="checkbox" class="n-jour" value="'+d+'">'+d+'</label>';}).join('')+'</div>'
   +'<label>Horaire (ex. 15:00-16:30)</label><input id="n-heure" placeholder="15:00-16:30">'
   +'<label>Première séance à partir du</label><input id="n-d" type="date" value="'+today()+'">'
   +'<div class="sub" style="margin-top:6px">Les séances du premier mois sont créées automatiquement. Tu les valides ensuite avec une case à cocher.</div>'
   +'<div class="actions"><button class="b p" onclick="okNewCours(\''+eid+'\')">Créer le cours</button><button class="b" onclick="closeM()">Annuler</button></div>');
}
function okNewCours(eid){
  var mat=v('n-mat').trim();
  if(!mat){alert('Indique la matière.');return;}
  var jours=[].slice.call(document.querySelectorAll('.n-jour:checked')).map(function(x){return x.value;}).join(',');
  if(!jours&&!confirm('Aucun jour habituel choisi : les séances ne seront pas générées automatiquement. Continuer ?'))return;
  closeM();
  call('saveCours',{EnfantID:eid,Matiere:mat,Prof:v('n-prof').trim(),PrixMois:Number(v('n-prix'))||0,SeancesMois:Number(v('n-nb'))||8,Jours:jours,Heure:v('n-heure').trim()},v('n-d'));
}

function openSeance(id,cid,date){
  if(needCours())return;
  var s=id?seance(id):null;
  s=s||{Date:date||today(),CoursID:cid||(fCours||D.cours[0].ID),Statut:'Prévue',Note:''};
  showM('<h2>'+(id?'Modifier':'Nouvelle')+' séance</h2>'
   +'<label>Cours</label>'+coursSelect('m-c',s.CoursID)
   +'<label>Date</label><input id="m-d" type="date" value="'+esc(String(s.Date).slice(0,10))+'">'
   +'<label>Statut</label><select id="m-s">'+STAT.map(function(x){return '<option'+(x===s.Statut?' selected':'')+'>'+x+'</option>';}).join('')+'</select>'
   +'<label>Note (ex. séance déplacée)</label><input id="m-n" value="'+esc(s.Note)+'">'
   +'<div class="actions"><button class="b p" onclick="okSeance(\''+(id||'')+'\')">Enregistrer</button>'
   +(id?'<button class="b d" onclick="if(confirm(\'Supprimer cette séance ?\')){closeM();call(\'deleteSeance\',\''+id+'\')}">Supprimer</button>':'')
   +'<button class="b" onclick="closeM()">Annuler</button></div>');
}
function okSeance(id){
  var o={Date:v('m-d'),CoursID:v('m-c'),Statut:v('m-s'),Note:v('m-n')};
  if(id)o.ID=id;
  closeM();call('saveSeance',o);
}

function openAct(id){
  var s=seance(id);if(!s)return;
  var c=crs(s.CoursID), can=s.Statut==='Prévue'||s.Statut==='Faite';
  showM('<h2>'+esc(fd(s.Date))+'</h2><div class="sub">'+esc(cname(c))+choraire(c)+'</div>'
   +'<div style="margin:8px 0"><span class="badge '+s.Statut+'">'+s.Statut+'</span>'+(s.Note?' <span class="sub">'+esc(s.Note)+'</span>':'')+'</div>'
   +(can?'<label class="chk"><input type="checkbox" '+(s.Statut==='Faite'?'checked':'')+' onchange="setStat(\''+id+'\',this.checked?\'Faite\':\'Prévue\')"> Séance faite</label>':'')
   +'<div class="actions">'
   +(s.Statut==='Prévue'?'<button class="b" onclick="openReport(\''+id+'\')">↪ Non faite : décaler / reporter</button>':'')
   +((s.Statut==='Annulée'||s.Statut==='Reportée')?'<button class="b" onclick="setStat(\''+id+'\',\'Prévue\')">Remettre en prévue</button>':'')
   +'<button class="b" onclick="openSeance(\''+id+'\')">✎ Modifier</button>'
   +'<button class="b" onclick="closeM()">Fermer</button></div>');
}

function openReport(id){
  var s=seance(id);if(!s)return;
  var c=crs(s.CoursID);
  showM('<h2>Séance non faite</h2><div class="sub">'+esc(cname(c))+' · '+esc(fd(s.Date))+'</div>'
   +'<label class="chk"><input type="radio" name="rp" value="report" checked> Reporter à une autre date</label>'
   +'<input id="r-d" type="date" value="'+nextDate(c,s.Date)+'" onfocus="document.querySelector(\'input[name=rp][value=report]\').checked=true">'
   +'<div class="sub" style="margin-top:4px">La date proposée est le prochain jour habituel du cours. Modifie-la si besoin.</div>'
   +'<label class="chk"><input type="radio" name="rp" value="annule"> Annuler sans la remplacer</label>'
   +'<div class="actions"><button class="b p" onclick="okReport(\''+id+'\')">Confirmer</button><button class="b" onclick="closeM()">Retour</button></div>');
}
function okReport(id){
  var mode=document.querySelector('input[name=rp]:checked').value, d=v('r-d');
  if(mode==='report'){
    if(!d){alert('Choisis une date.');return;}
    closeM();call('reporterSeance',id,d);
  }else{
    closeM();call('saveSeance',{ID:id,Statut:'Annulée',Note:'annulée'});
  }
}

function suggest(){
  var c=crs(v('m-c')), b=v('m-b');
  var cy=cycles(c).find(function(y){return y.start===b;});
  var amt=cy?Math.max(cyStat(c,cy).reste,0):0;
  document.getElementById('m-a').value=amt||Number(c.PrixMois)||'';
}
function onPayDate(){if(!bEdited)document.getElementById('m-b').value=v('m-d');suggest();}

function openPaie(id,cid){
  if(needCours())return;
  var x=id?D.paiements.find(function(y){return same(y.ID,id);}):null;
  var c0=x?x.CoursID:(cid||fCours||D.cours[0].ID);
  var d0=x?String(x.Date).slice(0,10):today();
  var b0=x?pstart(x):d0;
  var amt=x?x.Montant:(Number(crs(c0).PrixMois)||'');
  x=x||{Mode:'Espèces',Note:''};
  bEdited=!!id;
  showM('<h2>'+(id?'Modifier':'Nouveau')+' paiement</h2>'
   +'<label>Cours</label>'+coursSelect('m-c',c0,id?'':'onchange="suggest()"')
   +'<label>Date du paiement</label><input id="m-d" type="date" value="'+d0+'" '+(id?'':'onchange="onPayDate()"')+'>'
   +'<label>Début de la période payée</label><input id="m-b" type="date" value="'+b0+'" onchange="bEdited=true;'+(id?'':'suggest()')+'">'
   +'<div class="sub" style="margin-top:4px">Le mois commence à cette date (par défaut le jour du paiement).</div>'
   +'<label>Montant (DA)</label><input id="m-a" type="number" value="'+esc(amt)+'">'
   +'<label>Mode</label><input id="m-mode" value="'+esc(x.Mode)+'">'
   +'<label>Note</label><input id="m-n" value="'+esc(x.Note)+'">'
   +(id?'':'<div class="sub" style="margin-top:8px">📅 Les séances prévues de la période seront créées automatiquement.</div>')
   +'<div class="actions"><button class="b p" onclick="okPaie(\''+(id||'')+'\')">Enregistrer</button>'
   +(id?'<button class="b d" onclick="if(confirm(\'Supprimer ce paiement ?\')){closeM();call(\'deletePaiement\',\''+id+'\')}">Supprimer</button>':'')
   +'<button class="b" onclick="closeM()">Annuler</button></div>');
}
function okPaie(id){
  var cid=v('m-c');
  var o={Date:v('m-d'),CoursID:cid,Mois:v('m-b')||v('m-d'),Montant:Number(v('m-a'))||0,Mode:v('m-mode'),Note:v('m-n')};
  if(id)o.ID=id;
  else if(!String(crs(cid).Jours||'').trim())alert('Ce cours n\'a pas de jours habituels : aucune séance ne sera générée. Renseigne-les dans Réglages.');
  closeM();call('savePaiement',o);
}

google.script.run.withSuccessHandler(function(d){D=d;render();})
  .withFailureHandler(function(e){document.getElementById('app').innerHTML='<div class="empty">Erreur : '+esc(e.message||e)+'</div>';})
  .getData();

var __deferredPrompt=null;
function installHelp(){
  function standalone(){return window.matchMedia('(display-mode: standalone)').matches||window.navigator.standalone===true;}
  if(standalone()){alert('Déjà installée : tu utilises déjà l\'appli depuis ton écran d\'accueil 🎉');return;}
  var isIOS=/iPad|iPhone|iPod/.test(navigator.userAgent)&&!window.MSStream;
  if(__deferredPrompt){
    __deferredPrompt.prompt();
    __deferredPrompt.userChoice.finally(function(){__deferredPrompt=null;});
    return;
  }
  if(isIOS){
    showM('<h2>📲 Installer sur l\'écran d\'accueil</h2>'
      +'<p>1. Appuie sur <b>Partager</b> <span style="font-size:18px">⬆️</span> en bas de Safari (ou en haut, selon l\'appareil).</p>'
      +'<p>2. Choisis <b>« Sur l\'écran d\'accueil »</b>.</p>'
      +'<p>3. Appuie sur <b>Ajouter</b>.</p>'
      +'<div class="actions"><button class="b p" onclick="closeM()">Compris</button></div>');
  }else{
    showM('<h2>📲 Installer sur l\'écran d\'accueil</h2>'
      +'<p>Selon ton navigateur :</p>'
      +'<p><b>Chrome / Edge (Android ou ordinateur)</b> : menu <b>⋮</b> en haut à droite → <b>« Installer l\'application »</b> ou <b>« Ajouter à l\'écran d\'accueil »</b>.</p>'
      +'<p><b>Samsung Internet</b> : menu <b>≡</b> → <b>« Ajouter une page à »</b> → <b>Écran d\'accueil</b>.</p>'
      +'<div class="actions"><button class="b p" onclick="closeM()">Compris</button></div>');
  }
}

(function(){
  var DISMISS_KEY='cours_install_dismissed_at', SNOOZE_DAYS=14;
  function isStandalone(){return window.matchMedia('(display-mode: standalone)').matches||window.navigator.standalone===true;}
  function dismissedRecently(){
    var raw=localStorage.getItem(DISMISS_KEY);if(!raw)return false;
    return (Date.now()-Number(raw))/86400000<SNOOZE_DAYS;
  }
  function makeBanner(){
    var el=document.createElement('div');
    el.className='install';
    el.id='install-banner';
    document.body.insertBefore(el, document.querySelector('main'));
    return el;
  }
  function show(mode, promptFn){
    if(isStandalone()||dismissedRecently())return;
    var el=makeBanner();
    var isIOS=mode==='ios';
    el.style.display='flex';
    el.innerHTML='<span class="em">📲</span><div class="txt"><b>Installer sur l\'écran d\'accueil</b>'
      +(isIOS?'Appuyez sur Partager (⬆️) puis « Sur l\'écran d\'accueil ».':'Accès rapide, en plein écran, comme une vraie appli.')+'</div>'
      +(isIOS?'':'<button class="go" id="install-go">Installer</button>')
      +'<button class="close" id="install-close">✕</button>';
    document.getElementById('install-close').onclick=function(){
      localStorage.setItem(DISMISS_KEY,String(Date.now()));
      el.style.display='none';
    };
    if(!isIOS){
      document.getElementById('install-go').onclick=function(){
        if(promptFn)promptFn();
        el.style.display='none';
      };
    }
  }
  try{
    if(isStandalone()){/* déjà installée */}
    else if(/iPad|iPhone|iPod/.test(navigator.userAgent)&&!window.MSStream){
      show('ios');
    }else{
      window.addEventListener('beforeinstallprompt', function(e){
        e.preventDefault();
        __deferredPrompt=e;
        show('android', function(){e.prompt();});
      });
    }
    if('serviceWorker' in navigator){
      navigator.serviceWorker.register('?sw=1').catch(function(){});
    }
  }catch(e){}
})();
</script>
